{% extends "cuentas/base.html" %}
{% block titulo %}Iniciar sesión{% endblock %}
{% block contenido %}
<h1>Iniciar sesión</h1>
{% if error %}<p role="alert">{{ error }}</p>{% endif %}
<form method="post">{% csrf_token %}
  <p><label>Usuario <input name="usuario" autocomplete="username" required autofocus></label></p>
  <p><label>Contraseña <input name="contrasena" type="password" autocomplete="current-password" required></label></p>
  <button type="submit">Continuar</button>
</form>
{% endblock %}
