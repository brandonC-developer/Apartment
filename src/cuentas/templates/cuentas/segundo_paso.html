{% extends "cuentas/base.html" %}
{% block titulo %}Segundo factor{% endblock %}
{% block contenido %}
<h1>Segundo factor</h1>
<p>Escriba el código de su aplicación de autenticación o un código de recuperación.</p>
{% if error %}<p role="alert">{{ error }}</p>{% endif %}
<form method="post">{% csrf_token %}
  <p><label>Código <input name="codigo" autocomplete="one-time-code" required autofocus></label></p>
  <button type="submit">Entrar</button>
</form>
{% endblock %}
