# Cabeceras y tiempos hacia Gunicorn (ADR-032, decisión 13). Se SUSTITUYEN las del cliente:
# la IP de la auditoría sale de X-Forwarded-For y la conexión segura, de X-Forwarded-Proto.
proxy_pass http://sga_gunicorn;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_buffering on;
proxy_connect_timeout 10s;
proxy_read_timeout 30s;
proxy_redirect off;
