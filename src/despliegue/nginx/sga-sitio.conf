# Sitio del SGA. @NOMBRE_SITIO@ se sustituye al desplegar (localhost en la etapa A).
# ADR-032, decisiones 5, 11, 13, 16 y 17.

# Un Host desconocido no recibe respuesta (decisión 5).
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;
    server_tokens off;
    ssl_certificate     /etc/ssl/sga/certificado.pem;
    ssl_certificate_key /etc/ssl/sga/clave.pem;
    return 444;
}

server {
    listen 80;
    server_name @NOMBRE_SITIO@;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name @NOMBRE_SITIO@;
    server_tokens off;

    # Etapa A: certificado autofirmado. Los cifrados de TLS 1.2 se fijan en la etapa B con el
    # generador vigente (decisión 16); aquí se usan los del sistema.
    ssl_certificate     /etc/ssl/sga/certificado.pem;
    ssl_certificate_key /etc/ssl/sga/clave.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    gzip off;

    access_log /var/log/nginx/sga_acceso.log sga;

    # Tamaño del cuerpo de una petición (ADR-003, decisión del 22-oct-2026): 6 MiB solo en la ruta que sube
    # una fotografía (5 MiB del archivo y el resto del formulario) y 1 MiB en todo lo demás.
    client_max_body_size 1m;

    # HSTS por etapas (decisión 5): se activa en la etapa B con un max-age corto.
    # add_header Strict-Transport-Security "max-age=300" always;

    # Archivos estáticos propios (el script de reducción de fotografías): `collectstatic` los copia a
    # /opt/sga/static y Nginx los sirve de solo lectura (decisión del solicitante, 24-oct-2026). Las barras de
    # `location` y `alias` van emparejadas a propósito: sin eso, `/static../` leería fuera de la carpeta.
    location /static/ {
        alias /opt/sga/static/;
        autoindex off;
        expires 1h;
        add_header X-Content-Type-Options nosniff always;
    }

    # Subida de UNA fotografía del documento (RF-02): el único lugar donde se admite un cuerpo grande.
    location ~ ^/inquilinos/[0-9]+/fotografias/(frente|reverso)/$ {
        client_max_body_size 6m;
        include /etc/nginx/sga-limites.conf;
        limit_req zone=sga_general burst=30 nodelay;
        include /etc/nginx/sga-proxy.conf;
    }

    # Autenticación: zona estricta además de la general.
    location ^~ /entrar/ {
        include /etc/nginx/sga-limites.conf;
        limit_req zone=sga_auth burst=6 nodelay;
        limit_req zone=sga_general burst=30 nodelay;
        include /etc/nginx/sga-proxy.conf;
    }

    location / {
        include /etc/nginx/sga-limites.conf;
        limit_req zone=sga_general burst=30 nodelay;
        include /etc/nginx/sga-proxy.conf;
    }
}
