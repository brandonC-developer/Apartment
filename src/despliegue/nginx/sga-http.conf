# Nginx del SGA, nivel `http` (conf.d/). ADR-032, decisiones 5, 11, 13 y 17.
# El nginx.conf de Ubuntu 26.04 trae `server_tokens build;` a nivel http: no se puede repetir aquí, así
# que `server_tokens off;` va en cada bloque `server` del sitio. `verificar_http.py` lo comprueba.

# Registro propio sin cadena de consulta (`$uri`, no `$request_uri`): la búsqueda de un inquilino
# (RF-03) podría viajar en la URL (decisión 17).
log_format sga '$remote_addr [$time_local] $request_method $uri $status $body_bytes_sent $request_time';

# Límite de solicitudes (decisión 11): autenticación y general. 429 y registro en `warn`.
limit_req_zone $binary_remote_addr zone=sga_auth:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=sga_general:10m rate=10r/s;
limit_req_status 429;
limit_req_log_level warn;

upstream sga_gunicorn {
    server unix:/run/sga/gunicorn.sock fail_timeout=0;
}
