# PostgreSQL del SGA (ADR-032, decisión 12): solo por socket Unix, sin red.
# Va en conf.d/ del clúster, que `postgresql.conf` incluye. Cambiar `listen_addresses` y el grupo del
# socket exige reiniciar el servicio.
listen_addresses = ''
unix_socket_directories = '/var/run/postgresql'
unix_socket_group = 'sga_bd'
unix_socket_permissions = 0770

# Registro mínimo y sin valores de las consultas (pueden llevar datos personales).
log_statement = 'none'
log_parameter_max_length = 0
log_min_duration_statement = 1000
log_lock_waits = on
